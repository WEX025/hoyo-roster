[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hsr-character-state-sync"
version = "1.1.13"
description = "Fail-closed HSR partial synchronization through the shared Hoyo browser session broker."
requires-python = "==3.12.*"
dependencies = [
  "hoyo-browser-session==0.14.0",
  "jsonschema==4.25.0",
  "playwright==1.54.0",
  "referencing==0.36.2",
  "rfc3339-validator==0.1.4",
  "simplejson==3.20.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[project.scripts]
hsr-character-state-sync = "hsr_character_state_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_character_state_sync"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
incremental = false
cache_dir = ".venv/.mypy_cache"
